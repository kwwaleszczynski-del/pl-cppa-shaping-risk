[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-cppa-shaping-risk"
version = "0.1.0"
description = "Pay-as-produced vs baseload and two-shift corporate PPAs in Poland: cannibalisation, profile shaping cost, negative-price floor clauses, and PV + wind + battery portfolio sizing for P50/P90 cashflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cppa-shaping = "cppa_shaping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
